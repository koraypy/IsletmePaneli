name: Windows .exe derle

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Derle
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name IsletmePaneli app.py
      - uses: actions/upload-artifact@v4
        with:
          name: IsletmePaneli-windows
          path: dist/IsletmePaneli.exe
      - name: Release'e ekle (etiket varsa)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IsletmePaneli.exe
